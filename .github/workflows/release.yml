name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  wiki-ui:
    name: build wiki ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: wiki
      - run: bun run build
        working-directory: wiki
      - uses: actions/upload-artifact@v4
        with:
          name: wiki-dist
          path: wiki/dist

  build:
    name: build (${{ matrix.target }})
    needs: wiki-ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: wordkeep
            wiki_bin: wordkeep-wiki
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: wordkeep.exe
            wiki_bin: wordkeep-wiki.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            bin: wordkeep
            wiki_bin: wordkeep-wiki
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: wordkeep
            wiki_bin: wordkeep-wiki
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: wiki-dist
          path: wiki/dist
      - run: cargo build --release --locked --workspace --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING="wordkeep-${VERSION}-${{ matrix.target }}"
          ARCHIVE="${STAGING}.tar.gz"
          mkdir -p "$STAGING/wiki"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGING/"
          cp "target/${{ matrix.target }}/release/${{ matrix.wiki_bin }}" "$STAGING/"
          cp -r wiki/dist "$STAGING/wiki/"
          cp README.md LICENSE CHANGELOG.md "$STAGING/"
          tar -czf "$ARCHIVE" -C "$(dirname "$STAGING")" "$(basename "$STAGING")"
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".Substring(1)
          $staging = "wordkeep-$version-${{ matrix.target }}"
          $archive = "$staging.zip"
          New-Item -ItemType Directory -Force -Path $staging/wiki | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" $staging/
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.wiki_bin }}" $staging/
          Copy-Item -Recurse wiki/dist $staging/wiki/
          Copy-Item README.md, LICENSE, CHANGELOG.md $staging/
          Compress-Archive -Path $staging -DestinationPath $archive -Force
      - uses: actions/upload-artifact@v4
        with:
          name: wordkeep-${{ matrix.target }}
          path: wordkeep-*-${{ matrix.target }}.*

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          find . -type f \( -name 'wordkeep-*.tar.gz' -o -name 'wordkeep-*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
