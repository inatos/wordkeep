[package]
name = "wordkeep-wiki"
version = "0.1.0"
edition = "2021"
description = "Local Markdown wiki and Meilisearch companion for Wordkeep."
license = "MIT"

[dependencies]
axum = "0.7"
clap = { version = "4", features = ["derive"] }
notify = "6"
pulldown-cmark = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
walkdir = "2"
wordkeep-knowledge = { path = "../wordkeep-knowledge" }
