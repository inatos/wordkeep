[package]
name = "wordkeep"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Token-budgeted MCP server for coding agents: tree-sitter maps, call graphs, and project docs over stdio."
readme = "README.md"
license = "MIT"
repository = "https://github.com/inatos/wordkeep"
homepage = "https://github.com/inatos/wordkeep"
keywords = ["mcp", "tree-sitter", "developer-tools", "llm", "code-intelligence"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "wordkeep"
path = "src/main.rs"

[features]
default = []
# Opt-in semantic reranking for knowledge_search. Pulls fastembed (ONNX Runtime +
# tokenizers) and downloads a small embedding model on first use, so it is NOT in
# the default build - BM25 stays the lean, deterministic, offline baseline.
embeddings = ["dep:fastembed"]
# Opt-in exact Daslang (.das) support. Compiles the vendored tree-sitter grammar
# (vendor/tree-sitter-daslang/, ~12 MB of generated C) via build.rs + cc, so it
# is NOT in the default build - without it Daslang uses the line scanner in
# repo_map.rs. The grammar publishes no crate, hence the local vendor.
daslang = ["dep:tree-sitter-language"]
# Opt-in terminal dashboard for the savings telemetry, launched as a `dashboard`
# subcommand. Pulls ratatui (+ its bundled crossterm backend) - NOT in the
# default build, so the MCP server binary stays lean.
dashboard = ["dep:ratatui"]

[dependencies]
serde_json = "1"
walkdir = "2"
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
fastembed = { version = "4", optional = true }
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-glsl = "0.2"
tree-sitter-typescript = "0.23"
tree-sitter-language = { version = "0.1", optional = true }
# Dashboard-only (feature = "dashboard"); re-exports its own crossterm backend.
ratatui = { version = "0.29", optional = true }
tree-sitter-c-sharp = "0.23"

[build-dependencies]
# Only invoked when the `daslang` feature is on (see build.rs); compiles the
# vendored parser.c + scanner.c.
cc = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
