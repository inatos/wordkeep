[workspace]
members = [".", "crates/wordkeep-knowledge", "crates/wordkeep-wiki"]
resolver = "2"

[package]
name = "wordkeep"
version = "0.5.0"
edition = "2021"
rust-version = "1.74"
description = "Token-budgeted MCP server for coding agents: tree-sitter maps, call graphs, and project docs over stdio."
readme = "README.md"
license = "MIT"
repository = "https://github.com/inatos/wordkeep"
homepage = "https://github.com/inatos/wordkeep"
keywords = ["mcp", "tree-sitter", "developer-tools", "llm", "code-intelligence"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "wordkeep"
path = "src/main.rs"

[features]
default = []
# Pure-Rust Model2Vec static embeddings (no ONNX). Uses potion-retrieval-32M for
# markdown docs/rules/notes and potion-code-16M-v2 for code symbols.
semantic-m2v = ["dep:model2vec-rs"]
# Legacy fastembed (ONNX Runtime + tokenizers) compatibility backend; kept until
# evals verify semantic-m2v parity. Prefer `semantic-m2v` for new builds.
embeddings-fastembed = ["dep:fastembed"]
# Compatibility alias for legacy fastembed so existing scripts/launchers keep
# building until evals flip defaults to `semantic-m2v`.
embeddings = ["embeddings-fastembed"]
# Opt-in exact Daslang (.das) support. Compiles the vendored tree-sitter grammar
# (vendor/tree-sitter-daslang/, ~12 MB of generated C) via build.rs + cc, so it
# is NOT in the default build - without it Daslang uses the line scanner in
# repo_map.rs. The grammar publishes no crate, hence the local vendor.
daslang = ["dep:tree-sitter-language"]
# Opt-in terminal dashboard for the savings telemetry, launched as a `dashboard`
# subcommand. Pulls ratatui (+ its bundled crossterm backend) - NOT in the
# default build, so the MCP server binary stays lean.
dashboard = ["dep:ratatui"]
# Optional Ereshkigal GGUF letter-logit scorer (llama.cpp). Default cargo test
# stays heuristic-only; Betwixt launchers pass ereshkigal-vulkan (GPU offload).
ereshkigal = ["dep:ereshkigal-core"]
ereshkigal-vulkan = ["ereshkigal", "ereshkigal-core/vulkan"]
# True image-token logits via llama.cpp mtmd / mmproj (enables ereshkigal-core/vision).
visual_logits = ["ereshkigal", "ereshkigal-core/vision"]

[dependencies]
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
ignore = "0.4"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
notify-debouncer-mini = "0.4"
image = "0.25"
wordkeep-knowledge = { path = "crates/wordkeep-knowledge" }
ereshkigal-lang = { path = "../ereshkigal/ereshkigal-lang" }
ereshkigal-core = { path = "../ereshkigal/ereshkigal-core", optional = true }
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
# Pure-Rust Model2Vec static embeddings (feature = "semantic-m2v"); fancy-regex
# avoids C onig_sys and pulls zero ONNX Runtime.
model2vec-rs = { version = "0.5", default-features = false, features = ["fancy-regex", "hf-hub"], optional = true }
# Legacy ONNX embedding backend (feature = "embeddings-fastembed" / "embeddings").
fastembed = { version = "4", optional = true }
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-glsl = "0.2"
tree-sitter-typescript = "0.23"
tree-sitter-language = { version = "0.1", optional = true }
# Dashboard-only (feature = "dashboard"); re-exports its own crossterm backend.
ratatui = { version = "0.29", optional = true }
tree-sitter-c-sharp = "0.23"

[build-dependencies]
# Only invoked when the `daslang` feature is on (see build.rs); compiles the
# vendored parser.c + scanner.c.
cc = "1"

[[example]]
name = "cold_warm_bench"
path = "examples/cold_warm_bench.rs"
required-features = []

[profile.release]
opt-level = 3
lto = true
strip = true
